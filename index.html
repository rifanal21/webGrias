<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grias Property — Arsitektur Tropis Modern</title>
<style>
:root{--gold:#c9a45c;--ink:#0d0d0d;--paper:#faf8f4;--mute:#8a8a8a;--line:rgba(201,164,92,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px}
section{padding:120px 0}
.label{font-size:.72rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:18px}
h2{font-size:clamp(2rem,4vw,3rem);line-height:1.2;margin-bottom:24px}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:22px 40px;transition:.4s;color:#fff}
nav.scrolled{background:rgba(13,13,13,.92);padding:14px 40px;backdrop-filter:blur(8px)}
.logo{font-family:Georgia,serif;font-size:1.2rem;letter-spacing:.3em}
.logo b{color:var(--gold);font-weight:400}
nav ul{display:flex;gap:34px;list-style:none;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
nav ul a{position:relative;padding-bottom:4px}
nav ul a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:.35s}
nav ul a:hover::after{width:100%}

/* hero */
.hero{min-height:100vh;background:var(--ink);color:#fff;display:flex;align-items:center;position:relative;overflow:hidden;padding:0}
.hero::before{content:"";position:absolute;width:520px;height:520px;border:1px solid var(--line);border-radius:50%;right:-120px;top:50%;transform:translateY(-50%);animation:spin 40s linear infinite}
.hero::after{content:"";position:absolute;width:360px;height:360px;border:1px solid var(--line);right:-30px;top:50%;transform:translateY(-50%) rotate(45deg);animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.hero h1{font-size:clamp(2.6rem,7vw,5.6rem);line-height:1.1;max-width:800px}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{max-width:480px;color:#b9b9b9;margin:28px 0 40px}
.line{display:block;overflow:hidden}
.line span{display:block;transform:translateY(110%);animation:up 1.2s 1.7s cubic-bezier(.2,.8,.2,1) forwards}
.line:nth-child(2) span{animation-delay:1.85s}
.line:nth-child(3) span{animation-delay:2s}
@keyframes up{to{transform:none}}
.fade{opacity:0;animation:fadein 1s 2.6s forwards}
@keyframes fadein{to{opacity:1}}
.btn{display:inline-block;padding:15px 38px;border:1px solid var(--gold);color:var(--gold);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;position:relative;overflow:hidden;z-index:0;transition:color .4s;cursor:pointer;background:none}
.btn::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-101%);transition:.4s;z-index:-1}
.btn:hover{color:var(--ink)}
.btn:hover::before{transform:none}
.scroll{position:absolute;bottom:34px;left:50%;width:1px;height:60px;background:linear-gradient(var(--gold),transparent);animation:drop 2s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:80px;align-items:center}
.about p{color:#555;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:40px 20px;border-left:1px solid var(--line);padding-left:50px}
.stat b{display:block;font-family:Georgia,serif;font-size:3rem;font-weight:400;color:var(--gold);line-height:1}
.stat span{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* services */
.dark{background:var(--ink);color:#fff}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:50px;border:1px solid var(--line)}
.service{background:var(--ink);padding:44px 34px;transition:.4s}
.service:hover{background:#171717;transform:translateY(-4px)}
.service i{font-family:Georgia,serif;font-style:normal;color:var(--gold);font-size:.9rem;display:block;margin-bottom:30px}
.service h3{font-size:1.4rem;margin-bottom:12px}
.service p{color:#9a9a9a;font-size:.92rem}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:34px;margin-top:50px}
.project .img{aspect-ratio:4/3;overflow:hidden;background:#e8e3d9;position:relative}
.project .img div{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.project:hover .img div{transform:scale(1.07)}
.project .img::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:.6s}
.project:hover .img::after{width:100%}
.project h3{font-size:1.4rem;margin-top:18px}
.project small{color:var(--mute);font-size:.78rem;letter-spacing:.15em;text-transform:uppercase}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-top:50px;position:relative}
.step{border-top:1px solid var(--line);padding-top:24px}
.step b{font-family:Georgia,serif;font-size:2.2rem;font-weight:400;color:var(--gold)}
.step h3{font-size:1.15rem;margin:8px 0}
.step p{color:#9a9a9a;font-size:.9rem}

/* contact */
.contact{text-align:center}
.contact p{color:#555;max-width:520px;margin:0 auto 34px}
.info{display:flex;justify-content:center;gap:50px;flex-wrap:wrap;margin-top:50px;font-size:.9rem;color:#555}
.info b{display:block;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:400;margin-bottom:6px}
footer{background:var(--ink);color:#777;text-align:center;padding:30px;font-size:.75rem;letter-spacing:.15em}


/* preloader */
#pre{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:transform 1s cubic-bezier(.7,0,.2,1)}
#pre.done{transform:translateY(-100%)}
#pre .logo{color:#fff;opacity:0;animation:fadein 1s .2s forwards}
#pre .bar{width:140px;height:1px;background:rgba(255,255,255,.15);overflow:hidden}
#pre .bar i{display:block;height:100%;width:100%;background:var(--gold);transform:translateX(-100%);animation:load 1.2s .2s ease forwards}
@keyframes load{to{transform:none}}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);z-index:20}

/* glow + floating dots di hero */
.glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.18),transparent 65%);left:var(--mx,20%);top:var(--my,40%);transform:translate(-50%,-50%);pointer-events:none;transition:left .6s ease-out,top .6s ease-out}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.5;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-30px);opacity:.15}}

/* marquee */
.marquee{background:var(--gold);color:var(--ink);overflow:hidden;padding:20px 0;white-space:nowrap}
.marquee div{display:inline-block;animation:slide 28s linear infinite;font-family:Georgia,serif;font-size:1.3rem;letter-spacing:.12em}
.marquee span{margin:0 26px}
.marquee span:nth-child(even){opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}

/* tambahan efek */
.service{position:relative;overflow:hidden}
.service::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:.5s}
.service:hover::after{width:100%}
.project{transition-delay:var(--d,0s)}
.project .img::before{content:"";position:absolute;inset:0;background:var(--ink);z-index:2;transform-origin:top;transition:transform 1.2s cubic-bezier(.7,0,.2,1) .2s}
.project.in .img::before{transform:scaleY(0)}
.step{transition:.4s}
.step:hover{border-color:var(--gold);transform:translateY(-6px)}
.btn.pulse{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,164,92,.5)}70%,100%{box-shadow:0 0 0 18px rgba(201,164,92,0)}}

/* reveal */
.reveal{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:820px){
nav ul{display:none}nav{padding:20px}
section{padding:80px 0}
.about,.projects{grid-template-columns:1fr;gap:40px}
.stats{border:0;padding:0}
.services{grid-template-columns:1fr}
.steps{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,.line span,.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="pre"><div class="logo" id="preLogo"></div><div class="bar"><i></i></div></div>
<div id="prog"></div>

<nav id="nav">
  <a href="#home" class="logo" id="logo"></a>
  <ul id="menu"></ul>
</nav>

<header class="hero" id="home">
  <div class="wrap">
    <h1 id="heroTitle"></h1>
    <p class="fade" id="heroSub"></p>
    <a href="#kontak" class="btn fade" id="heroBtn"></a>
  </div>
  <div class="glow" id="glow"></div>
  <div class="scroll"></div>
</header>
<div class="marquee"><div id="marq"></div></div>

<section id="tentang"><div class="wrap about">
  <div class="reveal">
    <span class="label" id="aboutLabel"></span>
    <h2 id="aboutTitle"></h2>
    <div id="aboutText"></div>
  </div>
  <div class="stats reveal" id="stats"></div>
</div></section>

<section class="dark" id="layanan"><div class="wrap">
  <div class="reveal"><span class="label" id="svcLabel"></span><h2 id="svcTitle"></h2></div>
  <div class="services reveal" id="services"></div>
</div></section>

<section id="proyek"><div class="wrap">
  <div class="reveal"><span class="label" id="prjLabel"></span><h2 id="prjTitle"></h2></div>
  <div class="projects" id="projects"></div>
</div></section>

<section class="dark" id="proses"><div class="wrap">
  <div class="reveal"><span class="label" id="prsLabel"></span><h2 id="prsTitle"></h2></div>
  <div class="steps reveal" id="steps"></div>
</div></section>

<section class="contact" id="kontak"><div class="wrap reveal">
  <span class="label" id="ctLabel"></span>
  <h2 id="ctTitle"></h2>
  <p id="ctText"></p>
  <a class="btn" id="ctBtn" style="color:var(--ink)"></a>
  <div class="info" id="info"></div>
</div></section>

<footer id="footer"></footer>

<script src="data.js"></script>
<script>


const $ = id => document.getElementById(id);
const S = SITE;

$('logo').innerHTML = `${S.nama} <b>${S.namaAksen}</b>`;
$('menu').innerHTML = S.menu.map(m => `<li><a href="${m[1]}">${m[0]}</a></li>`).join('');
$('heroTitle').innerHTML = S.hero.baris.map(b => `<span class="line"><span>${b}</span></span>`).join('');
$('heroSub').textContent = S.hero.sub;
$('heroBtn').textContent = S.hero.tombol;

$('aboutLabel').textContent = S.tentang.label;
$('aboutTitle').textContent = S.tentang.judul;
$('aboutText').innerHTML = S.tentang.paragraf.map(p => `<p>${p}</p>`).join('');
$('stats').innerHTML = S.tentang.statistik.map(s => `<div class="stat"><b data-n="${s[0]}">${s[0]}</b><span>${s[1]}</span></div>`).join('');

$('svcLabel').textContent = S.layanan.label;
$('svcTitle').textContent = S.layanan.judul;
$('services').innerHTML = S.layanan.daftar.map((s,i) => `<div class="service"><i>0${i+1}</i><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');

$('prjLabel').textContent = S.proyek.label;
$('prjTitle').textContent = S.proyek.judul;
$('projects').innerHTML = S.proyek.daftar.map(p => {
  const bg = p.gambar ? `background-image:url('${p.gambar}')` : 'background:linear-gradient(135deg,#d9d2c3,#b9a98a)';
  return `<div class="project reveal"><div class="img"><div style="${bg}"></div></div><h3>${p.nama}</h3><small>${p.info}</small></div>`;
}).join('');

$('prsLabel').textContent = S.proses.label;
$('prsTitle').textContent = S.proses.judul;
$('steps').innerHTML = S.proses.langkah.map((s,i) => `<div class="step"><b>0${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');

$('ctLabel').textContent = S.kontak.label;
$('ctTitle').textContent = S.kontak.judul;
$('ctText').textContent = S.kontak.teks;
$('ctBtn').textContent = S.kontak.tombol;
$('ctBtn').href = `https://wa.me/${S.kontak.wa}?text=${encodeURIComponent(S.kontak.pesanWA)}`;
$('ctBtn').target = '_blank';
$('info').innerHTML = S.kontak.info.map(i => `<div><b>${i[0]}</b>${i[1]}</div>`).join('');
$('footer').textContent = S.footer;

/* nav background saat scroll */
addEventListener('scroll', () => $('nav').classList.toggle('scrolled', scrollY > 60));

/* animasi muncul saat di-scroll */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); countUp(e.target); }
}), {threshold:.15});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));


/* preloader */
$('preLogo').innerHTML = $('logo').innerHTML;
addEventListener('load', () => setTimeout(() => $('pre').classList.add('done'), 1500));

/* teks berjalan */
const words = S.berjalan.map(w => `<span>${w}</span><span>✦</span>`).join('');
$('marq').innerHTML = words + words + words + words;

/* titik melayang di hero */
const hero = $('home');
for (let i = 0; i < 14; i++) {
  const d = document.createElement('i'); d.className = 'dot';
  d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*6}s;animation-duration:${6+Math.random()*6}s`;
  hero.appendChild(d);
}

/* glow ikut kursor di hero */
hero.addEventListener('mousemove', e => {
  const r = hero.getBoundingClientRect();
  hero.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  hero.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* progress scroll + parallax */
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  $('prog').style.width = (scrollY / h * 100) + '%';
  if (scrollY < innerHeight) document.querySelector('.hero .wrap').style.transform = `translateY(${scrollY*.25}px)`;
});

/* jeda bertahap untuk kartu proyek */
document.querySelectorAll('.project').forEach((p,i) => p.style.setProperty('--d', (i%2)*.15 + 's'));

/* tombol magnet */
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('mousemove', e => {
    const r = b.getBoundingClientRect();
    b.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.3}px)`;
  });
  b.addEventListener('mouseleave', () => b.style.transform = '');
});
$('ctBtn').classList.add('pulse');

/* hitung naik untuk angka statistik */
function countUp(root){
  root.querySelectorAll('[data-n]').forEach(el => {
    const t = el.dataset.n, num = parseInt(t);
    if (isNaN(num)) return;
    const suffix = t.replace(/[0-9]/g,''); let c = 0;
    const step = Math.max(1, Math.ceil(num/40));
    const timer = setInterval(() => {
      c = Math.min(num, c + step); el.textContent = c + suffix;
      if (c >= num) clearInterval(timer);
    }, 35);
  });
}
</script>
</body>
</html>
