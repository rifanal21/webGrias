<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grias Property — Arsitektur Tropis Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a45c;--gold2:#e4c98a;--ink:#0d0d0d;--paper:#faf8f4;--sand:#f1ece2;--mute:#8a8a8a;--line:rgba(201,164,92,.35);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:300 17px/1.75 var(--sans);background:var(--paper);color:var(--ink);overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:300;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
em{font-style:italic;color:var(--gold)}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
section{padding:130px 0}
.label{display:flex;align-items:center;gap:16px;font-size:.72rem;font-weight:400;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.label::before{content:"";width:46px;height:1px;background:var(--gold)}
h2{font-size:clamp(2.3rem,4.6vw,4rem);line-height:1.1;max-width:760px}
.dark{background:var(--ink);color:#fff}
.sand{background:var(--sand)}
.head{margin-bottom:70px}

/* preloader + progress */
#pre{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:transform 1s cubic-bezier(.7,0,.2,1)}
#pre.done{transform:translateY(-100%)}
#pre .logo{color:#fff}
#pre .bar{width:140px;height:1px;background:rgba(255,255,255,.15);overflow:hidden}
#pre .bar i{display:block;height:100%;background:var(--gold);transform:translateX(-100%);animation:load 1.2s .1s ease forwards}
@keyframes load{to{transform:none}}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);z-index:20}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:26px 48px;transition:.4s;color:#fff}
nav.scrolled{background:rgba(13,13,13,.92);padding:15px 48px;backdrop-filter:blur(10px)}
.logo{font-family:var(--serif);font-size:1.45rem;font-weight:500;letter-spacing:.38em}
.logo b{color:var(--gold);font-weight:300;font-style:italic;letter-spacing:.2em;font-size:1.05rem}
nav ul{display:flex;gap:38px;list-style:none;font-size:.74rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase}
nav ul a{position:relative;padding-bottom:5px}
nav ul a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:.35s}
nav ul a:hover::after{width:100%}

/* tombol */
.btn{display:inline-block;padding:17px 44px;border:1px solid var(--gold);color:var(--gold);font-size:.74rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;position:relative;overflow:hidden;z-index:0;transition:color .4s,background .4s}
.btn::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-101%);transition:.4s;z-index:-1}
.btn:hover{color:var(--ink)}
.btn:hover::before{transform:none}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--gold2)}
.btn.solid::before{background:transparent}
.btn.solid:hover{background:transparent;color:var(--ink)}

/* hero */
.hero{min-height:100vh;background:radial-gradient(ellipse at 78% 42%,#2b2316,#0d0d0d 62%);color:#fff;display:flex;align-items:center;padding:120px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:80px;align-items:center;width:100%}
.hero h1{font-size:clamp(3rem,6.2vw,5.8rem);line-height:1.02}
.line{display:block;overflow:hidden;padding-bottom:.1em}
.line span{display:block;transform:translateY(105%);transition:transform 1.2s var(--ease) calc(var(--i)*.14s + .3s)}
.ready .line span{transform:none}
.hero p{max-width:430px;color:#aaa;margin:34px 0 44px;padding-left:22px;border-left:1px solid var(--gold)}
.fade{opacity:0;transform:translateY(20px);transition:opacity 1s var(--ease) 1.1s,transform 1s var(--ease) 1.1s}
.ready .fade{opacity:1;transform:none}
.frame{position:relative;aspect-ratio:5/4}
.frame::before{content:"";position:absolute;inset:0;border:1px solid var(--gold);transform:translate(20px,20px)}
.frame .in{position:absolute;inset:0;background:linear-gradient(160deg,#1d180e,#0d0d0d);border:1px solid var(--line);overflow:hidden}
.hero-art{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.2;stroke-linecap:round}
.hero-art *{stroke-dasharray:1;stroke-dashoffset:1}
.ready .hero-art *{animation:draw 2s calc(.7s + var(--i)*.12s) ease forwards}
.hero-art .f{fill:rgba(201,164,92,.18);stroke:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:0}
.ready .hero-art .f{animation:fadein 1.4s 3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* teks berjalan */
.marquee{background:var(--gold);color:var(--ink);overflow:hidden;padding:20px 0;white-space:nowrap}
.marquee div{display:inline-block;animation:slide 30s linear infinite;font-family:var(--serif);font-style:italic;font-size:1.6rem}
.marquee span{margin:0 28px}
.marquee span:nth-child(even){font-style:normal;font-size:.9rem;opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}

/* tentang */
.about{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:center}
.about .txt p{color:#555;margin-bottom:18px}
.about h2{margin-bottom:30px}
.pic{position:relative;aspect-ratio:4/5}
.pic .in{position:absolute;inset:0;overflow:hidden}
.pic .in svg,.project .pic svg{width:100%;height:100%;display:block}
.badge{position:absolute;left:-34px;bottom:44px;background:var(--gold);color:var(--ink);padding:26px 34px;font-family:var(--serif);box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
.badge b{display:block;font-size:3.6rem;font-weight:400;line-height:1}
.badge span{font-family:var(--sans);font-size:.7rem;font-weight:400;letter-spacing:.25em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:110px;border-top:1px solid var(--line)}
.stat{padding:36px 24px 0;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--serif);font-size:3.6rem;font-weight:300;color:var(--gold);line-height:1}
.stat span{font-size:.72rem;font-weight:400;letter-spacing:.25em;text-transform:uppercase;color:var(--mute)}

/* layanan */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{border:1px solid var(--line);padding:46px 38px 42px;position:relative;overflow:hidden;transition:transform .5s var(--ease),border-color .5s,background .5s}
.card::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:.6s var(--ease)}
.card:hover{transform:translateY(-10px);border-color:var(--gold);background:rgba(201,164,92,.06)}
.card:hover::after{width:100%}
.card svg{width:52px;height:52px;fill:none;stroke:var(--gold);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:34px;transition:transform .6s var(--ease)}
.card:hover svg{transform:scale(1.12) rotate(-4deg)}
.card .no{position:absolute;top:30px;right:34px;font-family:var(--serif);font-style:italic;color:#555;font-size:1.3rem}
.card h3{font-size:1.9rem;margin-bottom:12px}
.card p{color:#a0a0a0;font-size:.95rem}

/* proyek */
.projects{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.project{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--ink);color:#fff;cursor:default}
.project .pic{position:absolute;inset:0;transition:transform 1.2s var(--ease)}
.project .pic>div{position:absolute;inset:0;background-size:cover;background-position:center}
.project:hover .pic{transform:scale(1.07)}
.project .no{position:absolute;top:22px;left:26px;z-index:2;font-family:var(--serif);font-style:italic;color:var(--gold2);font-size:1.5rem}
.project .cap{position:absolute;left:0;right:0;bottom:0;padding:90px 30px 28px;background:linear-gradient(transparent,rgba(0,0,0,.82));transform:translateY(14px);transition:transform .6s var(--ease)}
.project:hover .cap{transform:none}
.project h3{font-size:2.1rem;line-height:1.1}
.project small{display:block;margin-top:6px;font-size:.72rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.project::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:.7s var(--ease)}
.project:hover::after{width:100%}

/* proses */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;position:relative}
.steps::before{content:"";position:absolute;top:34px;left:34px;right:34px;height:1px;background:var(--line)}
.step .n{position:relative;width:68px;height:68px;border:1px solid var(--gold);border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:1.7rem;color:var(--gold);margin-bottom:28px;transition:.4s}
.step:hover .n{background:var(--gold);color:var(--ink);transform:scale(1.08)}
.step h3{font-size:1.7rem;margin-bottom:8px}
.step p{color:#666;font-size:.95rem}

/* testimoni */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.quote{background:#161616;padding:44px 36px 36px;position:relative;transition:transform .5s var(--ease),background .5s}
.quote:hover{transform:translateY(-8px);background:#1d1a14}
.quote::before{content:"“";position:absolute;top:6px;left:30px;font-family:var(--serif);font-size:6rem;line-height:1;color:var(--gold);opacity:.6}
.quote p{font-family:var(--serif);font-size:1.4rem;line-height:1.45;margin:34px 0 28px;color:#eee}
.quote b{display:block;font-weight:400;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.quote span{font-size:.85rem;color:#888}

/* kontak */
.contact{background:linear-gradient(135deg,#c9a45c,#e4c98a 50%,#b8913f);color:var(--ink);text-align:center}
.contact .label{justify-content:center;color:var(--ink)}
.contact .label::before,.contact .label::after{content:"";width:46px;height:1px;background:var(--ink)}
.contact h2{margin:0 auto 26px;font-size:clamp(2.6rem,6vw,5.2rem);max-width:900px}
.contact p{max-width:480px;margin:0 auto 42px}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn.ghost{border-color:var(--ink);color:var(--ink)}
.btn.ghost::before{background:var(--ink)}
.btn.ghost:hover{color:var(--gold2)}
.info a{border-bottom:1px solid currentColor}
.info a:hover{opacity:.6}
#waFloat{position:fixed;right:26px;bottom:26px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);transition:transform .4s var(--ease);animation:wapulse 2.6s infinite}
#waFloat:hover{transform:scale(1.12)}
#waFloat svg{width:30px;height:30px}
@keyframes wapulse{0%{box-shadow:0 0 0 0 rgba(201,164,92,.6)}70%,100%{box-shadow:0 0 0 20px rgba(201,164,92,0)}}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:100px;padding-top:40px;border-top:1px solid rgba(13,13,13,.25);text-align:left;font-size:.95rem}
.info b{display:block;font-size:.68rem;letter-spacing:.35em;text-transform:uppercase;font-weight:500;margin-bottom:8px;opacity:.65}
footer{background:var(--ink);color:#777;text-align:center;padding:34px;font-size:.7rem;letter-spacing:.25em}

.reveal{opacity:0;transform:translateY(36px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

@media(max-width:900px){
body{font-size:16px}
section{padding:90px 0}
.wrap{padding:0 24px}
nav,nav.scrolled{padding:18px 24px}nav ul{display:none}
.hero .wrap,.about{grid-template-columns:1fr;gap:60px}
.frame{margin-right:20px}
.pic{max-width:420px}.badge{left:-10px}
.stats,.info{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0;padding-left:0}
.cards,.quotes,.projects{grid-template-columns:1fr}
.steps{grid-template-columns:1fr 1fr;row-gap:50px}.steps::before{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,.line span,.fade{opacity:1;transform:none}.hero-art *{stroke-dashoffset:0}.hero-art .f{opacity:1}}
</style>
</head>
<body>
<div id="pre"><div class="logo" id="preLogo"></div><div class="bar"><i></i></div></div>
<div id="prog"></div>

<nav id="nav"><a href="#home" class="logo" id="logo"></a><ul id="menu"></ul></nav>

<header class="hero" id="home">
  <div class="wrap">
    <div>
      <h1 id="heroTitle"></h1>
      <p class="fade" id="heroSub"></p>
      <a href="#kontak" class="btn fade" id="heroBtn"></a>
    </div>
    <div class="frame fade"><div class="in">
      <svg class="hero-art" viewBox="0 -10 400 320" aria-hidden="true">
        <path class="f" d="M105 150h110v80H105z"/>
        <circle style="--i:0" cx="305" cy="62" r="34" pathLength="1"/>
        <path style="--i:1" pathLength="1" d="M20 230h360"/>
        <path style="--i:2" pathLength="1" d="M85 122h230v8H85z"/>
        <path style="--i:3" pathLength="1" d="M135 92h145v30H135z"/>
        <path style="--i:4" pathLength="1" d="M100 130h200v100H100z"/>
        <path style="--i:5" pathLength="1" d="M105 150h110v80H105z"/>
        <path style="--i:6" pathLength="1" d="M160 150v80M215 150v80"/>
        <path style="--i:7" pathLength="1" d="M235 138v92M247 138v92M259 138v92M271 138v92M283 138v92"/>
        <path style="--i:8" pathLength="1" d="M345 230Q335 170 352 112"/>
        <path style="--i:9" pathLength="1" d="M352 112Q330 96 312 108M352 112Q338 88 316 84M352 112Q360 86 384 90M352 112Q372 104 392 122M352 112Q352 92 350 74"/>
        <path style="--i:10" pathLength="1" d="M60 248h280M90 262h220M120 276h160" stroke-opacity=".5"/>
      </svg>
    </div></div>
  </div>
</header>
<div class="marquee"><div id="marq"></div></div>

<section id="tentang"><div class="wrap">
  <div class="about">
    <div class="txt reveal"><span class="label" id="aboutLabel"></span><h2 id="aboutTitle"></h2><div id="aboutText"></div></div>
    <div class="pic reveal"><div class="in" id="aboutPic"></div><div class="badge" id="badge"></div></div>
  </div>
  <div class="stats reveal" id="stats"></div>
</div></section>

<section class="dark" id="layanan"><div class="wrap">
  <div class="head reveal"><span class="label" id="svcLabel"></span><h2 id="svcTitle"></h2></div>
  <div class="cards" id="services"></div>
</div></section>

<section class="sand" id="proyek"><div class="wrap">
  <div class="head reveal"><span class="label" id="prjLabel"></span><h2 id="prjTitle"></h2></div>
  <div class="projects" id="projects"></div>
</div></section>

<section id="proses"><div class="wrap">
  <div class="head reveal"><span class="label" id="prsLabel"></span><h2 id="prsTitle"></h2></div>
  <div class="steps" id="steps"></div>
</div></section>

<section class="dark" id="testimoni"><div class="wrap">
  <div class="head reveal"><span class="label" id="tstLabel"></span><h2 id="tstTitle"></h2></div>
  <div class="quotes" id="quotes"></div>
</div></section>

<section class="contact" id="kontak"><div class="wrap reveal">
  <span class="label" id="ctLabel"></span>
  <h2 id="ctTitle"></h2>
  <p id="ctText"></p>
  <div class="cta"><a class="btn solid" id="ctBtn"></a><a class="btn ghost" id="igBtn" target="_blank" rel="noopener"></a></div>
  <div class="info" id="info"></div>
</div></section>
<a id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Chat WhatsApp"><svg viewBox="0 0 32 32"><path d="M5 6h22v16H14l-7 5v-5H5z" fill="currentColor"/><circle cx="11" cy="14" r="1.6" fill="#c9a45c"/><circle cx="16" cy="14" r="1.6" fill="#c9a45c"/><circle cx="21" cy="14" r="1.6" fill="#c9a45c"/></svg></a>
<footer id="footer"></footer>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id), S = SITE;
const TST = S.testimoni || {label:"Kata Klien",judul:"Mereka yang sudah percaya.",daftar:[]};
const ICON = [
  '<path d="M6 24 24 8l18 16M12 20v20h24V20M20 40V28h8v12"/>',
  '<path d="M8 40l4-12L34 6l8 8L20 36zM28 12l8 8"/>',
  '<circle cx="16" cy="32" r="8"/><path d="M22 26l18-18M32 16l6 6M36 12l4 4"/>'
];

/* ilustrasi rumah (dipakai bila foto belum diisi) */
function art(i,k){
  const P=[["#14110b","#c9a45c","#f3dfa6","#1b1812"],["#0d0d0d","#2a2418","#c9a45c","#111"],["#efe7d6","#d9c79c","#c9a45c","#2a2418"],["#2b2417","#e4c98a","#fff3d0","#14110b"]][i%4];
  const d=i%4==2?'#2a2418':'#0a0a0a', f=i%2?' transform="translate(400 0) scale(-1 1)"':'', id=k+i;
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs>
<linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient>
<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[2]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient></defs>
<rect width="400" height="300" fill="url(#s${id})"/>
<g${f}><circle cx="75" cy="85" r="38" fill="${P[2]}" opacity=".85"/>
<rect y="230" width="400" height="70" fill="${d}" opacity=".9"/>
<rect x="85" y="122" width="230" height="8" fill="${d}"/><rect x="135" y="92" width="145" height="30" fill="${d}" opacity=".92"/>
<rect x="100" y="130" width="200" height="100" fill="${P[3]}"/>
<rect x="105" y="150" width="110" height="80" fill="url(#g${id})"/>
<path d="M160 150v80M215 150v80" stroke="${d}" stroke-width="2"/>
<g stroke="${P[2]}" stroke-width="2" opacity=".6"><path d="M235 138v92M247 138v92M259 138v92M271 138v92M283 138v92"/></g>
<path d="M345 230Q335 170 352 112" stroke="${d}" stroke-width="4" fill="none"/>
<path d="M352 112Q330 96 312 108M352 112Q338 88 316 84M352 112Q360 86 384 90M352 112Q372 104 392 122M352 112Q352 92 350 74" stroke="${d}" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="105" y="236" width="110" height="40" fill="url(#g${id})" opacity=".35"/></g></svg>`;
}

/* isi halaman dari data.js */
$('logo').innerHTML = `${S.nama} <b>${S.namaAksen}</b>`;
$('preLogo').innerHTML = $('logo').innerHTML;
$('menu').innerHTML = S.menu.map(m => `<li><a href="${m[1]}">${m[0]}</a></li>`).join('');
$('heroTitle').innerHTML = S.hero.baris.map((b,i) => `<span class="line"><span style="--i:${i}">${b}</span></span>`).join('');
$('heroSub').textContent = S.hero.sub;
$('heroBtn').textContent = S.hero.tombol;
const w = S.berjalan.map(x => `<span>${x}</span><span>✦</span>`).join('');
$('marq').innerHTML = w+w+w+w;

$('aboutLabel').textContent = S.tentang.label;
$('aboutTitle').textContent = S.tentang.judul;
$('aboutText').innerHTML = S.tentang.paragraf.map(p => `<p>${p}</p>`).join('');
$('aboutPic').innerHTML = art(1,'a');
const st = S.tentang.statistik, b2 = st[1] || st[0];
$('badge').innerHTML = `<b data-n="${b2[0]}">${b2[0]}</b><span>${b2[1]}</span>`;
$('stats').innerHTML = st.map(s => `<div class="stat"><b data-n="${s[0]}">${s[0]}</b><span>${s[1]}</span></div>`).join('');

$('svcLabel').textContent = S.layanan.label;
$('svcTitle').textContent = S.layanan.judul;
$('services').innerHTML = S.layanan.daftar.map((s,i) => `<div class="card reveal"><span class="no">0${i+1}</span><svg viewBox="0 0 48 48">${ICON[i%3]}</svg><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');

$('prjLabel').textContent = S.proyek.label;
$('prjTitle').textContent = S.proyek.judul;
$('projects').innerHTML = S.proyek.daftar.map((p,i) => {
  const pic = p.gambar ? `<div style="background-image:url('${p.gambar}')"></div>` : art(i,'p');
  return `<div class="project reveal"><span class="no">0${i+1}</span><div class="pic">${pic}</div><div class="cap"><h3>${p.nama}</h3><small>${p.info}</small></div></div>`;
}).join('');

$('prsLabel').textContent = S.proses.label;
$('prsTitle').textContent = S.proses.judul;
$('steps').innerHTML = S.proses.langkah.map((s,i) => `<div class="step reveal"><div class="n">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');

$('tstLabel').textContent = TST.label;
$('tstTitle').textContent = TST.judul;
$('quotes').innerHTML = TST.daftar.map(q => `<div class="quote reveal"><p>${q.teks}</p><b>${q.nama}</b><span>${q.peran}</span></div>`).join('');

$('ctLabel').textContent = S.kontak.label;
$('ctTitle').textContent = S.kontak.judul;
$('ctText').textContent = S.kontak.teks;
$('ctBtn').textContent = S.kontak.tombol;
$('ctBtn').href = `https://wa.me/${S.kontak.wa}?text=${encodeURIComponent(S.kontak.pesanWA)}`;
$('ctBtn').target = '_blank';
const igInfo = (S.kontak.info.find(i => /instagram|^ig$/i.test(i[0])) || [])[1] || '';
const igRaw = (S.kontak.instagram || igInfo || '').trim();
const igUrl = !igRaw ? '' : /^https?:\/\//i.test(igRaw) ? igRaw : `https://instagram.com/${igRaw.replace('@','')}`;
const ig = igUrl ? (igUrl.split('?')[0].split('/').filter(Boolean).pop() || 'instagram').replace('@','') : '';
$('igBtn').style.display = ig ? '' : 'none';
if (ig){ $('igBtn').href = igUrl; $('igBtn').textContent = 'Instagram @' + ig; }
const waUrl = `https://wa.me/${S.kontak.wa}?text=${encodeURIComponent(S.kontak.pesanWA)}`;
$('info').innerHTML = S.kontak.info.map(i => {
  const k = i[0].toLowerCase(); let href = '';
  if (k.includes('whatsapp') || k === 'wa') href = waUrl;
  else if (k.includes('instagram') || k === 'ig') href = igUrl;
  else if (k.includes('email') || i[1].includes('@') && i[1].includes('.') && !i[1].startsWith('@')) href = 'mailto:' + i[1];
  const val = href ? `<a href="${href}" ${href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>${i[1]}</a>` : i[1];
  return `<div><b>${i[0]}</b>${val}</div>`;
}).join('');
$('waFloat').href = waUrl;
$('footer').textContent = S.footer;

/* jeda bertahap untuk kartu dalam satu baris */
['services','projects','steps','quotes'].forEach(id => [...$(id).children].forEach((c,i) => c.style.setProperty('--d', (i%4)*.12+'s')));

/* pembuka halaman */
addEventListener('load', () => {
  setTimeout(() => document.body.classList.add('ready'), 900);
  setTimeout(() => $('pre').classList.add('done'), 1300);
});

/* nav, progress scroll */
addEventListener('scroll', () => {
  $('nav').classList.toggle('scrolled', scrollY > 60);
  $('prog').style.width = scrollY / (document.documentElement.scrollHeight - innerHeight) * 100 + '%';
});

/* muncul saat di-scroll + hitung naik */
function countUp(root){
  root.querySelectorAll('[data-n]').forEach(el => {
    const t = el.dataset.n, n = parseInt(t); if (isNaN(n)) return;
    const suf = t.replace(/[0-9]/g,''), step = Math.max(1, Math.ceil(n/40)); let c = 0;
    const tm = setInterval(() => { c = Math.min(n, c+step); el.textContent = c+suf; if (c>=n) clearInterval(tm); }, 35);
  });
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); countUp(e.target); io.unobserve(e.target); }
}), {threshold:.12});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
